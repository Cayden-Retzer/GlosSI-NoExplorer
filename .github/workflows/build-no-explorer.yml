name: Build GlosSI (no explorer.exe)

on:
  push:
    branches: [no-explorer]
  workflow_dispatch:

jobs:
  build:
    # windows-latest ships Visual Studio 2026 now; GlosSI's projects target VS 2022 (v143)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history; version info comes from git tags

      - name: Fetch upstream tags
        shell: powershell
        run: git fetch --no-tags https://github.com/Alia5/GlosSI.git "+refs/tags/*:refs/tags/*"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build GlosSITarget + GlosSIWatchdog
        shell: powershell
        run: .\build-no-explorer.ps1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: glossi-no-explorer
          path: dist-no-explorer/
          if-no-files-found: error
